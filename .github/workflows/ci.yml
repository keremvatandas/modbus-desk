name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets for Go embed
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  vulnerability:
    name: Go vulnerability check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets for Go embed
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          repo-checkout: false

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  desktop-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs:
      - backend
      - frontend
      - vulnerability
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal Wails build
            os: macos-latest
            artifact-name: ModbusDesk-macos-universal
            artifact-path: ModbusDesk-macos-universal.zip
          - name: Windows amd64 Wails build
            os: windows-latest
            artifact-name: ModbusDesk-windows-amd64
            artifact-path: ModbusDesk-windows-amd64.zip
          - name: Linux amd64 Wails build
            os: ubuntu-latest
            artifact-name: ModbusDesk-linux-amd64
            artifact-path: ModbusDesk-linux-amd64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        if: runner.os != 'Windows'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add Go bin to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gopath = go env GOPATH
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: wails build -nocolour -platform darwin/universal

      - name: Build Windows app
        if: runner.os == 'Windows'
        run: wails build -nocolour -platform windows/amd64

      - name: Build Linux app
        if: runner.os == 'Linux'
        run: wails build -nocolour -platform linux/amd64 -tags webkit2_41

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/ModbusDesk.app ModbusDesk-macos-universal.zip

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/ModbusDesk.exe -DestinationPath ModbusDesk-windows-amd64.zip -Force

      - name: Package Linux app
        if: runner.os == 'Linux'
        run: tar -czf ModbusDesk-linux-amd64.tar.gz -C build/bin ModbusDesk

      - name: Generate checksum
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.artifact-path }}" > "${{ matrix.artifact-path }}.sha256"

      - name: Generate checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = Get-FileHash -Algorithm SHA256 "${{ matrix.artifact-path }}"
          "$($hash.Hash.ToLower())  ${{ matrix.artifact-path }}" | Out-File -FilePath "${{ matrix.artifact-path }}.sha256" -Encoding ascii

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            ${{ matrix.artifact-path }}.sha256
          if-no-files-found: error
